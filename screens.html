<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINK | Quiz Screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  body { margin: 0; background: #0b0b0e; color: #e9e9ed; font-family: Inter, sans-serif; }
  a { color: #d4b48c; }
  a:hover { color: #efe4d6; }
  .board { width: max-content; padding: 80px; display: flex; flex-direction: column; gap: 48px; }
  .intro { display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
  .kicker { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #9397ab; }
  .title { font-size: 40px; font-weight: 500; letter-spacing: -.01em; }
  .note { font-size: 15px; color: #9397ab; }
  .row { display: flex; gap: 48px; align-items: flex-start; }
  .grid { display: grid; grid-template-columns: repeat(3, 390px); gap: 56px 48px; }
  .frame { display: flex; flex-direction: column; gap: 14px; }
  .label { display: flex; align-items: baseline; gap: 12px; }
  .id { font-size: 14px; font-weight: 500; padding: 4px 10px; border: 1px solid #9184d9; border-radius: 6px; }
  .name { font-size: 20px; font-weight: 500; }
  .device { position: relative; width: 390px; height: 844px; border-radius: 24px; overflow: hidden; transform: translateZ(0); box-shadow: 0 20px 50px rgba(0,0,0,.55); }
  .device.tall { height: 3922px; }
  .device iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<section class="board">
  <div class="intro">
    <div class="kicker">Kink by Marivana · Card QR quiz</div>
    <div class="title">What’s your intimacy language?</div>
    <div class="note">390 × 844 mobile. Every frame is the live prototype pinned to a state. Clickable version: <a href="index.html">KinkQuiz</a></div>
  </div>
  <div class="row">
    <div class="grid" id="grid"></div>
    <div class="frame" id="1g">
      <div class="label"><span class="id">1g</span><span class="name">Results · Physical Touch + Tend to Me</span></div>
      <div class="device tall"><iframe id="results-frame" src="index.html?preview=results" title="Results"></iframe></div>
    </div>
  </div>
</section>
<script>
  const frames = [
    { id: '1a', label: 'Age gate', p: 'age' },
    { id: '1b', label: 'Intro', p: 'intro' },
    { id: '1c', label: 'Part 1 · Q1 (selected)', p: 'q1' },
    { id: '1d', label: 'Interstitial', p: 'inter' },
    { id: '1e', label: 'Part 2 · Q6', p: 'q6' },
    { id: '1f', label: 'Lead capture', p: 'lead' }
  ];
  document.getElementById('grid').innerHTML = frames.map(f => `
    <div class="frame" id="${f.id}">
      <div class="label"><span class="id">${f.id}</span><span class="name">${f.label}</span></div>
      <div class="device"><iframe src="index.html?preview=${f.p}" title="${f.label}" loading="lazy"></iframe></div>
    </div>`).join('');

  // Size the results frame to the full length of the results page.
  const rf = document.getElementById('results-frame');
  window.addEventListener('load', async () => {
    const doc = rf.contentDocument;
    await doc.fonts.ready;
    const fit = () => { rf.parentElement.style.height = doc.getElementById('scroller').scrollHeight + 'px'; };
    fit();
    new ResizeObserver(fit).observe(doc.querySelector('.results'));
  });
</script>
</body>
</html>
